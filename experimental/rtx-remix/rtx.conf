# CNVoice RTX Remix probe - lighting pass 1
rtx.useVertexCapture = True
# the shim sets D3DTS_WORLD per rigid mesh (c124-c127): object-space capture + stable instance tracking
rtx.useWorldMatricesForShaders = True
rtx.zUp = True
# (rtx.enableAlwaysCalculateAABB culled everything: our WORLD is identity, so object-space boxes sit at the origin)
# the game's sun reaches Remix as a fixed function directional light; Remix gives those a fixed intensity
rtx.lightConversionDistantLightFixedIntensity = 6
# extra light from above so the scene is never pitch black while tuning
rtx.fallbackLightMode = 2
rtx.fallbackLightType = 0
rtx.fallbackLightDirection = 0.3, 0.2, -1
rtx.fallbackLightRadiance = 2, 2, 2
# volumetric fog off for now (the red haze in the first capture)
rtx.volumetrics.enable = False
